<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wovenleaf mobile capture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        background: #d9dbd0;
      }
      iframe {
        display: block;
        border: 0;
        width: 390px;
        height: 844px;
        background: #f6f3eb;
      }
    </style>
  </head>
  <body>
    <iframe
      src="/"
      title="Wovenleaf mobile app"
      width="390"
      height="844"
    ></iframe>
    <script>
      if (new URLSearchParams(location.search).has("player")) {
        document.querySelector("iframe").src = "/__marketing-player";
      }
      if (new URLSearchParams(location.search).has("landing")) {
        document.querySelector("iframe").src = "http://127.0.0.1:4321/";
        document.querySelector("iframe").title =
          "Wovenleaf mobile landing page";
      }
    </script>
  </body>
</html>
