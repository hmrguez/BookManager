<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><!-- Original Wovenleaf artwork; MIT License, Copyright 2026 Hector Rodriguez. --><rect width="390" height="844" rx="18" fill="#f4f0e6"/><rect x="18" y="18" width="354" height="808" rx="14" fill="none" stroke="#bfc1b4"/><text x="36" y="60" font-family="Georgia,serif" font-size="25" fill="#30352e">Wovenleaf</text><text x="36" y="115" font-family="Georgia,serif" font-size="23" fill="#30352e">The Quiet Orchard</text><text x="36" y="157" font-family="Georgia,serif" font-size="12" fill="#30352e">CHAPTER ONE</text><text x="36" y="215" font-family="Georgia,serif" font-size="16" fill="#30352e">The morning light rested on the wall.</text><text x="36" y="248" font-family="Georgia,serif" font-size="16" fill="#30352e">Beyond the window, leaves moved</text><text x="36" y="281" font-family="Georgia,serif" font-size="16" fill="#30352e">gently in the wind. There was time</text><text x="36" y="314" font-family="Georgia,serif" font-size="16" fill="#30352e">to turn a page, and time to let the</text><text x="36" y="347" font-family="Georgia,serif" font-size="16" fill="#30352e">words find their own quiet rhythm.</text><text x="36" y="380" font-family="Georgia,serif" font-size="16" fill="#30352e"></text><text x="36" y="413" font-family="Georgia,serif" font-size="16" fill="#30352e">She set a notebook beside the chair</text><text x="36" y="446" font-family="Georgia,serif" font-size="16" fill="#30352e">and began again. A few lines were</text><text x="36" y="479" font-family="Georgia,serif" font-size="16" fill="#30352e">enough to carry into the day.</text><path d="M42 690h275" stroke="#a9ad9b" stroke-width="2"/><text x="36" y="735" font-family="Georgia,serif" font-size="14" fill="#30352e">12 / 148</text><text x="36" y="795" font-family="Georgia,serif" font-size="12" fill="#30352e">Illustrative preview · fictional books</text></svg>
