name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Scan reachable history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --log-opts=--all --redact --config /repo/.gitleaks.toml
      - name: Check public asset provenance and prohibited dependencies
        run: python3 scripts/check-public-repo.py
      - name: Verify mobile application
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test
          bun run build
      - name: Verify landing page
        working-directory: apps/landing
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run build
